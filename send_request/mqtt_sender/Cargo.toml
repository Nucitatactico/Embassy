[package]
edition      = "2024"
name         = "mqtt_sender"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "mqtt_sender"
path = "./src/bin/main.rs"

[dependencies]
log                    = "0.4.27"
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
embassy-net = { version = "0.9.1", features = ["tcp", "dhcpv4", "medium-ethernet"] }
heapless = "0.9.3"
embassy-executor = "0.10.0"
esp-hal = { version = "1.1.2", features = ["esp32", "unstable"] }
esp-radio = { version = "0.18.0", features = ["esp32", "wifi", "esp-alloc"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy", "esp-radio", "esp-alloc"] }
esp-alloc = { version = "0.10.0", features = ["esp32"] }


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
