[package]
edition      = "2024"
name         = "gral_monitoring"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "gral_monitoring"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "alloc",
  "esp-alloc",
  "esp32",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }

esp-alloc   = { version = "0.11.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "esp32",
  "uart",
  "log-04",
  "critical-section",
  "colors",
] }
critical-section = "1.2.0"
static_cell      = "2.1.1"
hd44780-i2c-nostd = "0.3.2"
heapless = "0.9.3"
embedded-hal-async = "1.0.0"
onewire = "0.4.0"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
